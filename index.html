<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17140f" />
  <meta name="description" content="숫자 조합과 확률을 비트는 복고풍 보드 로그라이크, 한 판만" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <title>한 판만 — 숫자 보드 로그라이크</title>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="cabinet">
    <header class="marquee">
      <div class="bulbs" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">NUMBER RISK ROGUELIKE</p>
        <h1>한 판만</h1>
        <p class="subtitle">멈추면 번다. 계속하면 터진다.</p>
      </div>
      <button id="soundBtn" class="icon-button" type="button" aria-label="효과음 켜기">♪</button>
    </header>

    <section id="titleScreen" class="screen title-screen">
      <div class="coin-mark">₩</div>
      <p class="story">빚을 갚을 마지막 밤.<br />숫자를 엮고, 규칙을 속이고, 살아서 나가라.</p>
      <button id="startBtn" class="big-button pulse" type="button">한 판만</button>
      <div class="records" id="titleRecords"></div>
      <button id="howBtn" class="text-button" type="button">게임 방법</button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <div class="status-row">
        <div class="status-card"><span>도박장</span><strong id="stageLabel">1-1</strong></div>
        <div class="status-card target"><span>목표</span><strong id="targetLabel">₩500</strong></div>
        <div class="status-card"><span>보유금</span><strong id="bankLabel">₩0</strong></div>
      </div>

      <div id="bossBanner" class="boss-banner hidden"></div>

      <div class="table-area">
        <aside class="next-panel">
          <span>NEXT</span>
          <strong id="nextTile" class="next-tile">7</strong>
          <small id="turnLabel">1 / 10</small>
        </aside>

        <div>
          <div id="board" class="board" role="grid" aria-label="4 곱하기 4 숫자판"></div>
          <p id="hint" class="hint">빈칸을 눌러 숫자를 놓으세요</p>
        </div>

        <aside class="round-panel">
          <span>이번 판</span>
          <strong id="potLabel">₩0</strong>
          <span>연승 배율</span>
          <strong id="riskLabel" class="risk">×1</strong>
        </aside>
      </div>

      <div id="scoreBurst" class="score-burst hidden" aria-live="polite"></div>

      <div class="combo-box">
        <div class="combo-head"><span>발견한 조합</span><span id="comboTotal">기본 ×1</span></div>
        <div id="comboLog" class="combo-log"><span class="muted">아직 조합이 없습니다</span></div>
      </div>

      <div class="item-rack-wrap">
        <div class="section-title"><span>규칙 장치</span><small id="itemCount">0 / 5</small></div>
        <div id="itemRack" class="item-rack"><div class="empty-rack">빈 장치 슬롯</div></div>
      </div>

      <footer class="game-footer">
        <div class="footer-buttons">
          <button id="catalogBtn" class="text-button" type="button">조합 도감</button>
          <button id="menuBtn" class="text-button" type="button">기록 포기</button>
        </div>
        <div id="message" class="message" aria-live="polite"></div>
      </footer>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <p id="modalKicker" class="eyebrow"></p>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
